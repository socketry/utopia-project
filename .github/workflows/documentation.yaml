name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "documentation-${{ github.ref }}"
  cancel-in-progress: true

env:
  BUNDLE_WITH: maintenance
  PAGEFIND_REVISION: 8d6285085b079ebbe75bd1ac497a273a41a340d1

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Checkout Pagefind fork
      uses: actions/checkout@v7
      with:
        repository: samuel-williams-shopify/pagefind
        ref: ${{ env.PAGEFIND_REVISION }}
        path: .pagefind
        persist-credentials: false

    - name: Cache Pagefind binary
      id: pagefind-cache
      uses: actions/cache@v6
      with:
        path: .pagefind/target/release/pagefind
        key: pagefind-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PAGEFIND_REVISION }}

    - uses: actions/setup-node@v7
      if: steps.pagefind-cache.outputs.cache-hit != 'true'
      with:
        node-version: 24

    - name: Install Pagefind Rust toolchain
      if: steps.pagefind-cache.outputs.cache-hit != 'true'
      run: |
        rustup toolchain install nightly --component rust-src
        rustup target add wasm32-unknown-unknown --toolchain nightly

    - name: Install wasm-pack
      if: steps.pagefind-cache.outputs.cache-hit != 'true'
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: v0.14.0

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ruby
        bundler-cache: true
    
    - name: Installing packages
      if: steps.pagefind-cache.outputs.cache-hit != 'true'
      run: sudo apt-get install wget

    - name: Build Pagefind fork
      if: steps.pagefind-cache.outputs.cache-hit != 'true'
      timeout-minutes: 30
      run: bundle exec bake utopia:project:pagefind

    - name: Generate documentation
      timeout-minutes: 10
      env:
        PAGEFIND_BINARY_PATH: ${{ github.workspace }}/.pagefind/target/release/pagefind
      run: bundle exec bake utopia:project:static --force no
    
    - name: Upload documentation artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs
  
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
    
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{steps.deployment.outputs.page_url}}
    
    needs: generate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          preview: ${{ github.event_name == 'pull_request' }}
